<ion-content 
  class="login-content" 
  style="--background: url('assets/icon/imagee.jpeg') no-repeat center center / cover;"
>

  <div style="
    display: flex;
    flex-direction: column;
    height: 100%;
  ">

    <!-- الأعلى -->
    <div style="
      display: flex;
      height: auto;
      margin-top: -3%;
      flex-direction: row;
      width: 100%;
      align-items: center;
      box-sizing: border-box;
    ">
      <div style="display: flex; flex-direction: row; margin-inline-start: 3%; margin-top: 10%;margin-bottom: 5%;" 
           (click)="goBack()">
        <ion-icon name="close"></ion-icon>
      </div>
    </div>

    <!-- التقويم -->
    <div class="calendar-header">
      <ion-button fill="clear" (click)="prevMonth()">⏮</ion-button>
      <h4 (click)="nextMonth()" class="month-title">
        {{ getMonthName(currentMonth) }} {{ currentYear }}
      </h4>
      <ion-button fill="clear" (click)="nextMonth()">⏭</ion-button>
    </div>

    <div class="calendar-grid">
      <div class="week-days">
        <div *ngFor="let day of weekDays" class="day-header">{{ day }}</div>
      </div>

      <div class="days-grid">
        <div 
          *ngFor="let day of monthDays"
          class="day-cell"
          [ngClass]="{ empty: !day }"
          (click)="onDateClick(day)"
        >
          <div [style.color]="color_day(day)" *ngIf="day">
            {{ day.getDate() }}
          </div>
        </div>
      </div>
    </div>

    <!-- صف الأزرار -->
    <div style="display: flex;align-items: center;text-align: center;justify-content: center;width: 100vw;"><ion-card  style="background-color: #9D9D9D3D;width: 100vw;height: 8vh;"><div class="action-row">
      <div>{{ indx }}</div>
      <div style="display: flex; flex-direction: row; width: 50%; justify-content: end;">
        <img src="assets/icon/addd.png"
             alt="Add Icon"
             style="height: 65%; width: 15%; margin-inline-end: 3%;"
             routerLink="/add-calendar">

        <img src="assets/icon/removee.png"
             alt="Remove Icon"
             style="height: 65%; width: 15%;">
      </div>
    </div></ion-card></div>

    <!-- ✅ الجزء السفلي فقط قابل للتمرير -->
<ion-content
  style="
    --background: transparent;
    background: transparent;
  "
>

  <ion-list
    style="
      flex: 1;
      padding: 2% 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: transparent;
    "
  >

    <ion-item-sliding *ngFor="let u of user; let i = index">
      <ion-item
        lines="none"
        style="
          --background: transparent;
          background: transparent;
          padding: 0;
        "
      >

        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2% 5%;
            margin: 0 5%;
            background-color: rgba(217, 216, 216, 0.5); /* نصف شفافية */
            border-radius: 15px;
            height: 20vw;
            width: 100%;
          "
        >
          <div style="display: flex; flex-direction: column; margin-inline-start: 10%;">
            <p style="margin-top: 3%;">sdddd</p>
            <p style="margin: 0;">fffff</p>
          </div>

          <div style="display: flex; align-items: center; gap: 10px;">
            <p style="margin: 0;">ggggg</p>
            <ion-toggle
              style="
                --track-width: 10vw;
                --track-height: 10vw;
                --handle-width: 3.5vw;
                --handle-height: 3.5vw;
              "
            >
            </ion-toggle>
          </div>
        </div>

      </ion-item>

      <!-- أزرار السحب -->
      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="deleteUser(i)">
          حذف
        </ion-item-option>
        <ion-item-option color="primary" (click)="editUser(i)">
          تعديل
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>

  </ion-list>
</ion-content>




  </div>

</ion-content>
