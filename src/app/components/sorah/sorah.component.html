<ion-content class="login-content" style=" --background: url('assets/icon/imagee.jpeg') no-repeat center center / cover;display: flex; flex-direction: column;height: 100vh;"[scrollY]="false" >
<div style="
  width: 100vw;
  height: 6vh;
 
  border: 2px solid black;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2vw;
"(click)="onclick()">
  <!-- اليسار -->
  <div style="display: flex; gap: 0.5vw; align-items: center;">
    <img src="assets/icon/islam 3.png" alt="صورة" style="width: 10vw; height: 5vh;">
    <img src="assets/icon/islam 3.png" alt="صورة" style="width: 10vw; height: 4vh; margin-top: 2%;">
  </div>

  <!-- الوسط -->
  <div style="
    display: flex;
    align-items: center;
 justify-content: center;
    width: 55vw;
    height: 7vh;
    position: relative;
  ">
    <img src="assets/icon/label 1.png" alt="صورة" style="    width: 50vw;
 object-fit: contain;">
    <!-- مثال نص فوق الصورة -->
    <div style="
      position: absolute;
      color: rgb(164, 8, 8);
      font-weight: bold;
      font-size: 1.2vw;
    ">
      <div style="font-size: 5vw;">سوره الفاتحه</div> 
    </div>
  </div>

  <!-- اليمين -->
  <div style="display: flex; gap: 0.5vw; align-items: center;">
    <img src="assets/icon/islam 3.png" alt="صورة" style="width: 10vw; height: 4vh; margin-top: 2%;">
    <img src="assets/icon/islam 3.png" alt="صورة" style="width: 10vw; height: 5vh;">
  </div>
</div>

  <div style="justify-content: center;width: 100vw;margin-left: 2%;margin-right:2%;" >
   <div style="text-align: center; font-size: 5vw; margin: 3% 0;">
  بسم الله الرحمن الرحيم
</div>
    <span *ngFor="let item of list; let i = index;" style="position: relative;">
   <span style="position: absolute;margin-top: -3vh;" ><span [style]="Style_r(i)"> <img src="assets/icon/save.png" alt="صورة" style="height:4vh;width: 4.6vw;"><img src="assets/icon/save.png" alt="صورة" style="height: 4vh;width: 4.6vw;"> <img src="assets/icon/save.png" alt="صورة" style="height: 4vh;width: 4.6vw;"></span></span>  
  <span (click)="click(i)" [style]="Style(i)">{{ item }}</span>
   <div style="
  position: relative;
  width: 7vw;
  height: 3vh;
  display: inline-block;
 
">
  <img src="assets/icon/star.png" 
       alt="صورة" 
       style="width: 100%; height: 100%; object-fit: contain;">
       
  <div style="
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: black; /* غيّر اللون حسب لون الصورة */
    font-size: 1vw;
    font-weight: bold;
    text-align: center;
    
  ">
   <div style="font-size: 2vw;">{{i}}</div>
  </div>
</div>
&nbsp;
</span></div>
<div style="height:100%;"(click)="onclick()"></div>
</ion-content>
