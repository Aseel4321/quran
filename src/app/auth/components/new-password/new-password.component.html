<ion-content style="--overflow: hidden;">
  <div style="display: flex;flex-direction: row;margin-inline-start:5%; margin-top: 5%;"><ion-icon name="arrow-back-outline"></ion-icon></div>
  

  <div class="otp-container1">
    <div style="display: flex; flex-direction: row;">
      <img src="assets/icon/rest.png" alt="lock image" class="imagee" />
    </div>

    <div class="title" [ngStyle]="title()">{{ 'SECURITY_SETTINGS' | translate }}</div>

    <div
      style="margin-top: 5%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;"
    >
      <div></div>
        <div style="margin-top: 2%;">
        <ion-item class="input-box">
          <ion-icon name="lock-closed-outline" slot="start" class="center-icon"></ion-icon>
          <ion-input
            [(ngModel)]="password"
            [type]="password_type"
            [placeholder]="'NEW_PASSWORD' | translate"
            (keyup)="onKeyup_password($event)"
            (keyup)="onInputChange($event)"
          ></ion-input>
          <ion-icon
            [name]="password_bool ? 'eye-off-outline' : 'eye-outline'"
            slot="end"
            (click)="eye()"
          ></ion-icon>
        </ion-item>
      </div>

      <!-- password ttstrength -->
      <div
        style="margin-top: 2%; text-align: center; margin-left: 3%; margin-right: 3%; align-items: center; justify-content: center; width: 90%;margin-bottom: 0%;"
      >
        <div class="rectangle-container">
          <div
            class="rectangle"
            *ngFor="let rect of list; let i = index"
            [style.backgroundColor]="color(i)"
          ></div>
        </div>
      </div>
 <div [style.color]="password_color" style="height:0.9vh;font-size:2vw;margin-top: 0%;margin-bottom: 2%">{{Text}}</div>
      <!-- password confirmation -->
      <div style="margin-top: 2%;">
        <ion-item class="input-box">
          <ion-icon name="lock-closed-outline" slot="start" class="center-icon"></ion-icon>
          <ion-input
            (keyup)="onKeyup_repassword($event)"
            [(ngModel)]="repassword.text_password"
            [type]="repassword.password_type"
            [placeholder]="'CONFIRM_PASSWORD' | translate"
          ></ion-input>
          <ion-icon
            [name]="repassword.password_bool ? 'eye-off-outline' : 'eye-outline'"
            slot="end"
            (click)="re_eye()"
          ></ion-icon>
        </ion-item>
      </div>
  <div style="height:2vh;"> <div [ngStyle]="color_password()">{{text_password}}</div></div>
      <button [class]="validation()" type="submit" (click)=" login()">
        {{ 'SAVE_CHANGES' | translate }}
      </button>
       <div *ngIf="isLoading" style="text-align: center;">
  <img src="assets/icon/hold-on.gif" alt="Login Image"
       style="width: 65px; height: 65px; border-radius: 10%;">
       <br/><br/>
</div>
    </div>
  
  </div>    <img 
  src="assets/icon/Group3.png" 
  alt="Login Image" 
 [style]="style_image2()"

/>
</ion-content>
