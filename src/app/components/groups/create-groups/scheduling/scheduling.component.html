<div class="schedule-card">

  <h2 class="title">Scheduling</h2>

  <!-- Start Date -->
  <label class="label">Start date</label>
  <div class="input-box">
    <input type="date" />
    <img src="assets/icon/calendar.png" class="icon" />
  </div>

  <!-- Daily reminder -->
  <div class="input-box">
    <img src="assets/icon/bell.png" class="icon" />
    <input type="time" placeholder="Daily reminder time" />
  </div>

  <!-- Repeat reminder -->
  <label class="label">Repeat reminder</label>
  <div class="chips">
    <span class="chip active">Daily</span>
    <span class="chip">every 2 days</span>
    <span class="chip">weekends only</span>
  </div>

  <!-- Button -->
  <button class="continue-btn">Continue</button>

</div>
