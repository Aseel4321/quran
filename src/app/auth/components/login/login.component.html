
<ion-content  class="login-content" [scrollY]="true" 
>
<div class="bg"></div>
<form #loginForm="ngForm" >

 <div class="image-logo">
  <img 
    src="assets/icon/Group 88.png" 
    alt="Login Image" 
    class="login-image"
   
  />
</div>
<div class="logo" 
     style="display: flex; align-items: center; gap: 10px; flex-direction: row-reverse; margin-top: -8%;">
  <img src="assets/icon/mosque.png" alt="Login Image" class="img" >
  <div >
    <h1>{{ 'WELCOME_BACK' | translate }}</h1>
    <div class="login-d"><div class="title">{{ 'LOGIN_TO_YOUR_ACCOUNT' | translate }}</div></div>

  </div>
</div>

   
    <div class="input-box">
      <ion-icon name="mail-outline" class="icon" slot="start"></ion-icon>
      <ion-input 
        placeholder="{{ 'EMAIL' | translate }}" 
        type="email" 
     class="icon"
        name="email"
        required
        [(ngModel)]="loginData.email">
      </ion-input>
      <ion-icon (click)="remove()" name="close-circle" slot="end"></ion-icon>
    </div>

    <br />


    <div class="input-box">
      <ion-icon name="lock-closed-outline"  class="icon" slot="start"></ion-icon>
      <ion-input 
        placeholder="{{ 'PASSWORD' | translate }}" 
        [type]="password_type"
        name="password"
        required
        [(ngModel)]="loginData.password">
      </ion-input>
      <ion-icon (click)="eye()" [name]="password_icon" slot="end"></ion-icon>
    </div>
    <br />

  <div class="options">
  <div class="remember-me">
    <ion-checkbox [(ngModel)]="loginData.rememberMe" name="rememberMe"></ion-checkbox>
    <span>{{ 'REMEMBER_ME' | translate }}</span>
  </div>
  <a class="forgot" (click)="forgot_nav()"> {{ 'FORGOT_PASSWORD' | translate }} </a>
</div>


    <br />

    <button (click)="login()"
  class="login-button"
  type="submit"
  [disabled]="!loginForm.form.valid"
  [ngClass]="{ 'active-button': loginForm.form.valid }">
 {{ 'LOGIN' | translate }}
</button>

    <br />
    <p class="signup-text" >
      {{ 'NO_ACCOUNT' | translate }}
      <a (click)="signup_nav()">{{ 'SIGN_UP' | translate }}</a>
    </p> <div *ngIf="isLoading; else notLoading" style="text-align: center; margin-top: 1%;">
  <ion-spinner name="crescent" style="width: 50px; height: 50px; color:#FFBC42;"></ion-spinner>
  <br/><br/>
</div>

<ng-template #notLoading>
 
  <div ></div>
</ng-template>
<img 
  src="assets/icon/Group89.png" 
  alt="Login Image" 
  class="login-image2"
 [style]="style_image2()"
/>

  </form>

</ion-content>
