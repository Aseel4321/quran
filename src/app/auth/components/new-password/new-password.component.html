

<ion-content [scrollY]="isKeyboardOpen" style=" top: 0; left: 0;
"><div class="page-bg"></div> 
   <div class="otp-container1">
<div class="back" (click)="goBack()"><ion-icon name="close"></ion-icon></div>

 
    <div style="display: flex; flex-direction: row;">
      <img src="assets/icon/password-reset.png" alt="lock image" class="imagee" />
    </div>

    <div class="title" [ngStyle]="title()">{{ 'SECURITY_SETTINGS' | translate }}</div>

    <div
     class="input-div"
    >
 
        <div style="margin-top: 2%;">
        <ion-item class="input-box">
          <ion-icon name="lock-closed-outline" slot="start" ></ion-icon>
          <ion-input 
            [(ngModel)]="password"
            [type]="password_type"
            [placeholder]="'NEW_PASSWORD' | translate"
            (keyup)="onKeyup_password($event)"
            (keyup)="onInputChange($event)"
          ></ion-input>
          <ion-icon class="icon"
            [name]="password_bool ? 'eye-off-outline' : 'eye-outline'"
            slot="end"
            (click)="eye()"
          ></ion-icon>
        </ion-item>
      </div>


      <div
       class="password-leng"
      >
        <div class="rectangle-container">
          <div
            class="rectangle"
            *ngFor="let rect of list; let i = index"
            [style.backgroundColor]="color(i)"
          ></div>
        </div>
      </div>
 <div [style.color]="password_color" class="password-leng-text">{{Text}}</div>

      <div style="margin-top: 1.5%;">
        <ion-item class="input-box">
          <ion-icon name="lock-closed-outline"  slot="start" ></ion-icon>
          <ion-input 
            (keyup)="onKeyup_repassword($event)"
            [(ngModel)]="repassword.text_password"
            [type]="repassword.password_type"
            [placeholder]="'CONFIRM_PASSWORD' | translate"
          ></ion-input>
          <ion-icon class="icon"
            [name]="repassword.password_bool ? 'eye-off-outline' : 'eye-outline'"
            slot="end"
            (click)="re_eye()"
          ></ion-icon>
        </ion-item>
      </div>
  <div style="height:1.1vw;margin-top: -2%;"> <div [ngStyle]="color_password()">{{text_password}}</div></div>
      <button [class]="validation()" type="submit" (click)=" login()">
        {{ 'SAVE_CHANGES' | translate }}
      </button>
       <div *ngIf="isLoading" style="text-align: center;">
  <img src="assets/icon/hold-on1.webp" alt="Login Image"
       style="width: 65px; height: 65px; border-radius: 10%;">
       <br/><br/>
</div>
    </div>
  
  </div> 
   <img 
  src="assets/icon/Group3.png" 
   class="login-image2"
  alt="Login Image" 
 [style]="style_image2()"

/>

</ion-content>
