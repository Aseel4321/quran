<div class="slide-content">

  <h2 class="title">Customize notifications</h2>

  <!-- Message Type -->
  <div class="msg-type">

    <div
      class="row"
      [class.active]="messageType === 'pre'"
      (click)="messageType = 'pre'">
      <span class="label">Pre-made message</span>
      <ion-radio value="pre" [(ngModel)]="messageType"></ion-radio>
      <div class="mark"></div>
    </div>

    <div class="divider"></div>

    <div
      class="row"
      [class.active]="messageType === 'custom'"
      (click)="messageType = 'custom'">
      <span class="label">Custom message</span>
      <ion-radio value="custom" [(ngModel)]="messageType"></ion-radio>
      <div class="mark"></div>
    </div>

  </div>

  <!-- Message Input -->
  <div class="message-box" *ngIf="messageType === 'custom'">
    <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
    <input type="text" placeholder="Message" />
  </div>

  <!-- Alert Sound -->
  <div class="sound-section" *ngIf="messageType === 'custom'">
    <span class="label">Alert sound</span>

    <div class="sound-options">
      <div
        class="sound-pill"
        [class.active]="selectedSound === 'alarm'"
        (click)="selectedSound = 'alarm'">
        Alarm
      </div>

      <div
        class="sound-pill"
        [class.active]="selectedSound === 'nature'"
        (click)="selectedSound = 'nature'">
        Nature sounds
      </div>
    </div>
  </div>

  <!-- Button -->
  <button class="button">
    Create Challenge
  </button>

</div>
