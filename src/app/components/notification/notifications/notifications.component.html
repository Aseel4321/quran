<ion-content class="login-content" scroll="false">
<div class="bg"></div>
  <!-- الشريط العلوي -->
  <div style="display: flex;
              height: 7%;
              margin-top: 5%;
              flex-direction: row;
              width: 100vw;
              align-items: center;
              box-sizing: border-box;
              padding: 0 2vw;">

    <!-- يسار -->
    <ion-icon name="close" (click)="goBack()"></ion-icon>

    <img src="assets/icon/notification.png"
         alt="Notification"
         style="width: 7vw; height: 3vh; margin-inline-start: 20%;margin-top: 2%;">

    <!-- النص في المنتصف -->
    <div style="flex: 1; text-align: center; font-weight: bold; margin-inline-start: 5%;" [ngStyle]="title()">
      {{ 'notifications' | translate }}
    </div>

 <div  style="width: 5.5vw; height: 3vh; margin-inline-start: 20%; margin-inline-end: 10%;"></div>
    <!--<img src="assets/icon/trach.png"
         alt="Trash"
         style="width: 5.5vw; height: 3vh; margin-inline-start: 20%; margin-inline-end: 10%;">-->
  </div>

  <!-- الأزرار -->
  <div style="display: flex; justify-content: center;margin-top: 3%;">
    <button (click)="showSection('READ')" 
        
            [style]="setStyle('READ')">
       {{ 'READ' | translate }}
    </button>

    <button (click)="showSection('UNREAD')" 
          [style]="setStyle('UNREAD')" 
          >
      {{ 'UNREAD' | translate }}
    </button>
  </div>
  <div style="  display: flex;flex-direction: column;   margin-top: 0%;  padding-top: -5%;        
  ">
<div style="width: 100vw;margin-bottom: 13%;;overflow-y: scroll;height: 85vh;  padding-bottom: 5%; ">
  <div *ngIf="list && list.length > 0  else loading">

  <div
    *ngFor="let item of list; let i = index"
    style="margin-bottom: 2%; margin-top: 2%; margin-left: 5%; margin-right: 5%; height: 7vh; border-radius: 15px;"
  >
    <ion-item-sliding class="notification-sliding">

      <ion-item
        button
        class="notification-item"
        (click)="notifications_read(item.id)"
      >
        <ion-label>
          <h3 class="title">إشعار</h3>
          <p class="message">{{ item.message }}</p>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option
          color="danger"
          class="delete-option"
          (click)="notifications_delete(item.id, i)"
        >
          <ion-icon name="trash-outline"></ion-icon>
          <span>حذف</span>
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>
  </div>

</div>
</div>
  </div>
<ng-template #loading>
 لايوجد اشعارات
</ng-template>
</ion-content>
