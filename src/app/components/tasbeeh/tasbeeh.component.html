<div style="display: flex; flex-direction: column; width: 100vw; height: 100vh;">

  <!-- جزء السلايدر -->
<ion-content style="height: 70vh; display: flex; justify-content: center; align-items: center;">   <div style="display: flex; flex-direction: row;text-align: center;align-items: center;height: 12vw;width:100vw ;">
  <img 
    src="assets/icon/Group333.png" 
    alt="Login Image" 
   
    
    style="display: block; width: 50%;margin-inline-end: 65%;margin-top: 9%;"
  />
</div>
<h1 style=" align-items: center;text-align: center;justify-content: center;font-weight: 400;">{{'Tesbeeh' | translate }}</h1>

 <!-- اجعل المحتوى يأخذ كامل الشاشة -->
<ion-slides 
  [options]="slideOpts" 
  (ionSlideDidChange)="onSlideChange()"
  style="height:85%; width:100%;"
>
  <ion-slide *ngFor="let item of slid">
    <div style="display: flex;flex-direction: column;width: 100vw;"> <div class="slide-box">{{ item }}</div>
    <div style="width:  90%; height:0.7%; color: rgb(198, 193, 193); border: 1px solid #ccc; border-radius: 10px; background-color: rgb(198, 193, 193); margin: 0 auto;"></div>
    <div class="slide-box">{{ item }}</div></div>
   
  </ion-slide>
</ion-slides>



<!-- المؤشرات -->
<div
  style="text-align:center; align-items:center; justify-content:center; display:flex; flex-direction:row; width:100vw; margin-top:10px;"
>
  <div
    *ngFor="let item of list; let i = index"
    style="display:flex; flex-direction:row; width:10vw;"
  >
    <div [ngStyle]="Color(i)"></div>
  </div>
</div>
</ion-content>

<div class="login-image half-circle-left"
     [style]="style_image3()"
>

  <div style="position: relative; display: flex; flex-direction: column;justify-content: center;text-align: center; align-items: center;margin-top: 15%;">
    <div class="circle " ><div style="display: flex;flex-direction: row;"><img src="assets/icon/arrow.png" alt="Login Image" style="width:5vw; height:5vw;margin-top: 25%;"><img src="assets/icon/Line1.png" alt="Login Image" style="width:5vw; height:5vw;margin-top: 25%;"><img src="assets/icon/arrow.png" alt="Login Image" style="width:5vw; height:5vw;margin-top: 25%;transform: scaleY(-1);"></div></div>
   <div class="login-image2"
  [style]="c2_image()" 
  (click)="count()" 
  style="display: flex; justify-content: center; align-items: center;"
>
  <div><div style=" width: 33px; 
  height: 33px; 
  background-color: #ffffff; 
  border-radius: 50%;padding-top: 13%;color: #3d3c3c;">{{num}}</div></div>
</div>
    <div class="circle" style="margin-top: 50%;"><img src="assets/icon/so.png" alt="Login Image" style="width:6vw; height:6vw;margin-top: 22%;"></div>
  </div>

</div>

  <img 
  src="assets/icon/Group33.png" 
  alt="Login Image" 
  class="login-image2"
 [style]="style_image2()"
/>

</div>
