 <ion-icon name="chevron-back" style="margin-top:3%;width: 10vw;height: 2vh;"></ion-icon>
<img
  src="assets/icon/user1.jpg" 
  class="circle-img"
/>
<div style="display: flex;flex-direction: column;width: 90%;"> <div style="margin-inline-start: 3vw;">John Smith</div> <div style="margin-inline-start: 3vw;font-size: 2.7vw;color: burlywood;">Online</div></div>
<div style="width:100% ;text-align: end;"><img
  src="assets/icon/phone.png" 
  style="width: 5vw;height: 5vw;margin-inline-end:4%;"
/> <img
  src="assets/icon/menu.png" 
   style="width: 5vw;height: 5vw;"
/></div></div>
<div style="width: 100%;display: flex;flex-direction: row; justify-content: start;"><div class="custom-box-left">
  هذا نص داخل المربعععع لارررررععععععععععععععععععععععععععععععععععععععععععععععععع
</div></div>
<div style="width: 100%;display: flex;flex-direction: row; justify-content: flex-end;"><div class="custom-box-right">
  هذا نص داخل المربع
</div></div>
<div
  style="
    display: flex;
    flex-direction: row;
    position: fixed;
    bottom: 3%;
    width: 100%;               /* مهم جداً لتوسيط العناصر */
    justify-content: center;   /* توسيط كامل */
    align-items: center;
  "
>
  <div class="search-box">
    <img src="assets/icon/loupe.png" class="icon" />
    <textarea placeholder="بحث..." class="search-area" [(ngModel)]="searchText"></textarea>
  </div>

  <img
    src="assets/icon/voice.png"
    style="
      width: 9vw;
      height: 9vw;
      cursor: pointer;
      user-select: none;
      margin-inline-start: 3%;
    "  
    (click)="messages()"
  />
