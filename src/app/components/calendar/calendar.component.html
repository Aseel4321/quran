<div class="calendar-header">
  <ion-button fill="clear" (click)="prevMonth()">⏮</ion-button>
  <h4 (click)="nextMonth()" class="month-title">
    {{ getMonthName(currentMonth) }} {{ currentYear }}
  </h4>
  <ion-button fill="clear" (click)="nextMonth()">⏭</ion-button>
</div>

<!-- تقويم شهر واحد فقط -->
<div class="calendar-grid">
  <div class="week-days">
    <div *ngFor="let day of weekDays" class="day-header">{{ day }}</div>
  </div>

  <div class="days-grid">
    <div 
      *ngFor="let day of monthDays"
      class="day-cell"
      [ngClass]="{ empty: !day }"
      (click)="onDateClick(day)"
    >
     <div [style.color]="color_day(day)" *ngIf="day">
  {{ day.getDate() }}
</div>
    </div>
  </div>
</div>
<div class="action-row">
  <div>{{ indx }}</div>
<div style="display: flex; flex-direction: row; width: 50%; height: 50%; justify-content: end;">
  <img src="assets/icon/addd.png"
       alt="Add Icon"
       style="height: 60%; width: 10%; margin-inline-end: 3%;">

  <img src="assets/icon/removee.png"
       alt="Remove Icon"
       style="height: 50%; width: 10%; ">
</div>


</div>

<div style="width: 100vw;">
  <div *ngFor="let user of user;"
       style="display: flex; justify-content: flex-end; align-items: center; padding-right: 5%; margin: 2% 5%; height: 7vh; background-color: #E8E0C8; border-radius: 45px;">

    <ion-toggle 
      style="--track-width: 2vw; --track-height: 3vw; --handle-width: 3vw; --handle-height: 4vw;">
    </ion-toggle>

  </div>
</div>




</ion-content>
