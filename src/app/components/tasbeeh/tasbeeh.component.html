<div style="display: flex; flex-direction: column; width: 100vw; height: 100vh;">

  <!-- جزء السلايدر -->
<ion-content style="height: 70vh">   <div style="display: flex; flex-direction: row;text-align: center;align-items: center;height: 12vw;width:100vw ;">
  <img 
    src="assets/icon/Group68.png" 
    alt="Login Image" 
    class="login-image1"
    
    style="display: block; width: 37%;margin-inline-end: 65%;"
  />
</div>
<h1 style=" align-items: center;text-align: center;justify-content: center;">Tesbeeh</h1>
 <!-- اجعل المحتوى يأخذ كامل الشاشة -->
<swiper
  [slidesPerView]="1"
  [spaceBetween]="10"
  [loop]="true"
  (swiper)="onSwiper($event)"
  (slideChange)="onSlideChange()"
  style="height:85%; width: 100%;"
  class="mySwiper"
>
  <ng-template swiperSlide>
    <div class="slide-box">Slide 1</div>
  </ng-template>
  <ng-template swiperSlide>
    <div class="slide-box">Slide 2</div>
  </ng-template>
  <ng-template swiperSlide>
    <div class="slide-box">Slide 3</div>
  </ng-template>
  <ng-template swiperSlide>
    <div class="slide-box">Slide 4</div>
  </ng-template>
  <ng-template swiperSlide>
    <div class="slide-box">Slide 5</div>
  </ng-template>
</swiper><div style="margin-inline-start:20%; display: flex; flex-direction: row;">
  <div *ngFor="let item of list; let i = index">
    {{ item }}
  </div>
</div>
</ion-content>
