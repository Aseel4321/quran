
<ion-content class="login-content">
  <form #loginForm="ngForm">
    <br /> <ion-icon  name="arrow-back-outline"></ion-icon>
  
    <h1 class="title">
      {{ 'Profile' | translate }}
    </h1>

    <div class="logo" class="logo">
      <img src="assets/icon/moslem-woman.png" alt="Login Image" style="width:35%; height: 35%; border-radius: 50%;">
    </div>

    <!-- الاسم -->
 <!-- الاسم -->
<ion-item class="input-box">
  <ion-icon name="person-outline" slot="start"></ion-icon>
  <ion-input
    #nameInput
    name="name"
    [(ngModel)]="name"
    (ionInput)="onKeyup_name($event)"
    [readonly]="true"
    placeholder="{{user.fullName}}"
    type="text">
  </ion-input>
  <ion-icon name="pencil" slot="end" (mousedown)="enableInput('name')"></ion-icon>
</ion-item>

<!-- البريد -->
<ion-item class="input-box">
  <ion-icon name="mail-outline" slot="start"></ion-icon>
  <ion-input
    #emailInput
    name="email"
    [(ngModel)]="email"
    (ionInput)="onKeyup_email($event)"
    [readonly]="true"
    placeholder="{{user.email}}"
    type="text">
  </ion-input>
  <ion-icon name="pencil" slot="end" (mousedown)="enableInput('email')"></ion-icon>
</ion-item>

<!-- الهاتف -->
<ion-item class="input-box">
  <ion-select interface="alert" name="countryCode" [(ngModel)]="selectedCountryCode" [placeholder]="selectedCountryCode">
    <ion-select-option *ngFor="let country of countries" [value]="country.dial_code">
      {{ country.name }} ({{ country.dial_code }})
    </ion-select-option>
  </ion-select>

  <ion-input
    #phoneInput
    name="phone"
    [(ngModel)]="phonenumber"
    (ionInput)="onKeyup_phone($event)"
    [readonly]="true"
    placeholder="{{user.phone}}"
    type="tel">
  </ion-input>
  <ion-icon name="pencil" slot="end" (mousedown)="enableInput('phone')"></ion-icon>
</ion-item>
    <ion-grid>
      <ion-row>
   <ion-col size="6">
  <ion-item class="small-item">
    <ion-icon name="calendar-outline" class="icon" slot="start"></ion-icon>
    <ion-datetime
      [(ngModel)]="dateOfBirth"
      (ionChange)="onDateChangee($event)"
      display-format="D/M/YYYY"
    placeholder="{{user.dob}}">
    </ion-datetime>
  </ion-item>
</ion-col>

        <ion-col size="6" class="gender-segment">
    <ion-segment value="male" [(ngModel)]="selectedGender" name="selectedGender" >
  <ion-segment-button value="male" (click)="setGender('MALE')">
   {{ 'Male' | translate }}
  </ion-segment-button>
  <ion-segment-button value="female" (click)="setGender('FEMALE')"> 
   {{ 'Female' | translate }}
  </ion-segment-button>
 
</ion-segment>

        </ion-col>
      </ion-row>
    </ion-grid>

    <!-- زر الدخول -->
    <button [class]="valid()" type="submit" (click)="update()">
      {{ 'LOGIN' | translate }}
    </button>


  
  </form>
</ion-content>
