<ion-content  class="chats-content" 
><div class="bg"></div>
<div style="display: flex;flex-direction: row;margin-top: 10%;margin-inline-start: 3.5%;justify-content: start;border-bottom: 3px solid #D9D9D9;margin-inline-end: 3.5%;margin-bottom:5%;">
 <ion-icon name="chevron-back" style="margin-top:3%;width: 10vw;height: 2vh;"></ion-icon>
<img
  src="assets/icon/user1.jpg" 
  class="circle-img"
/>
<div style="display: flex;flex-direction: column;width: 90%;"> <div style="margin-inline-start: 3vw;">{{user_chat.otherUserName}}</div> <div style="margin-inline-start: 3vw;font-size: 2.7vw;color: burlywood;">Online</div></div>
<div style="width:100% ;text-align: end;"><img
  src="assets/icon/phone.png" 
  style="width: 5vw;height: 5vw;margin-inline-end:4%;"
/> <img
  src="assets/icon/menu.png" 
   style="width: 5vw;height: 5vw;"
/></div></div><div style="padding-bottom: 5%; margin-top: -4%;height: 80%;width: 100vw;overflow-y: auto;"><div *ngFor="let msg of Messages" style="width: 100%;display: flex;flex-direction: column;">
  
  <div style="width: 100%;display: flex;flex-direction: row; justify-content: start;margin-top: 3%;"  *ngIf="msg.senderId === user" ><div class="custom-box-left">
{{msg.content}}</div></div>
<div style="width: 100%;display: flex;flex-direction: row; justify-content: flex-end;margin-top: 3%;"  *ngIf="msg.senderId != user"><div class="custom-box-right">
{{msg.content}}
</div></div>
</div></div>   

<div
  style="
    display: flex;
    flex-direction: row;
    position: fixed;
    bottom: 3%;
    width: 100%;              
    justify-content: center;   
    align-items: center;
  "
>
  <div class="search-box">
    <img src="assets/icon/loupe.png" class="icon" />
    <textarea placeholder="بحث..." class="search-area" [(ngModel)]="searchText"></textarea>
  </div>

  <img
    src="assets/icon/voice.png"
    style="
      width: 9vw;
      height: 9vw;
      cursor: pointer;
      user-select: none;
      margin-inline-start: 3%;
    "  
    (click)="messages()"
  />
</div>

</ion-content>
