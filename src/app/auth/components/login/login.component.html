
<ion-content class="login-content">
<form #loginForm="ngForm">
 <div style="display: flex; flex-direction: row;text-align: center;align-items: center;margin-bottom: 0%;">
  <img 
    src="assets/icon/rectt.png" 
    alt="Login Image" 
    class="login-image"
    
    style="display: block;height:35vw;; width: 90%;margin-inline-start: 10%;"
  />
</div>
 


<div class="logo" 
     style="display: flex; align-items: center; gap: 10px; flex-direction: row-reverse; margin-top: -2%;">
  <img src="assets/icon/mosque.png" alt="Login Image" class="img" >
  <div >
    <h1>{{ 'WELCOME_BACK' | translate }}</h1>
    <div class="login-d"><p style="margin-inline-start:30%;margin-top: -5% ;">{{ 'LOGIN_TO_YOUR_ACCOUNT' | translate }}</p></div>

  </div>
</div>

   
    <div class="input-box">
      <ion-icon name="mail-outline" class="icon" slot="start"></ion-icon>
      <ion-input 
        placeholder="{{ 'EMAIL' | translate }}" 
        type="email" 
     class="icon"
        name="email"
        required
        [(ngModel)]="loginData.email">
      </ion-input>
      <ion-icon (click)="remove()" name="close-circle" slot="end"></ion-icon>
    </div>

    <br />


    <div class="input-box">
      <ion-icon name="lock-closed-outline"  class="icon" slot="start"></ion-icon>
      <ion-input 
        placeholder="{{ 'PASSWORD' | translate }}" 
        [type]="password_type"
        name="password"
        required
        [(ngModel)]="loginData.password">
      </ion-input>
      <ion-icon (click)="eye()" [name]="password_icon" slot="end"></ion-icon>
    </div>
    <br />

  <div class="options">
  <div class="remember-me">
    <ion-checkbox [(ngModel)]="loginData.rememberMe" name="rememberMe"></ion-checkbox>
    <span>{{ 'REMEMBER_ME' | translate }}</span>
  </div>
  <a class="forgot" (click)="forgot_nav()"> {{ 'FORGOT_PASSWORD' | translate }} </a>
</div>


    <br />

    <button (click)="login()"
  class="login-button"
  type="submit"
  [disabled]="!loginForm.form.valid"
  [ngClass]="{ 'active-button': loginForm.form.valid }">
 {{ 'LOGIN' | translate }}
</button>

    <br />
 <div *ngIf="isLoading" style="text-align: center;margin-top: 1%;">
  <img src="assets/icon/hold-on.gif" alt="Login Image"
       style="width: 65px; height: 65px;">
       <br/><br/>
</div>

    <p class="signup-text" >
      {{ 'NO_ACCOUNT' | translate }}
      <a (click)="signup_nav()">{{ 'SIGN_UP' | translate }}</a>
    </p>
<img 
  src="assets/icon/Group89.png" 
  alt="Login Image" 
  class="login-image2"
 [style]="style_image2()"
/>
  </form>
</ion-content>
