<div style="display: flex; flex-direction: column; width: 100vw; height: 100vh;">

  <!-- جزء السلايدر -->
<ion-content style="height: 70vh; display: flex; justify-content: center; align-items: center;">   <div style="display: flex; flex-direction: row;text-align: center;align-items: center;height: 12vw;width:100vw ;">
  <img 
    src="assets/icon/Group333.png" 
    alt="Login Image" 
   
    
    style="display: block; width: 50%;margin-inline-end: 65%;margin-top: 9%;"
  />
</div>
<h1 style=" align-items: center;text-align: center;justify-content: center;font-weight: 400;">Tesbeeh</h1>

 <!-- اجعل المحتوى يأخذ كامل الشاشة -->
<swiper
  [slidesPerView]="1"
  [spaceBetween]="10"
  [loop]="true"
  (swiper)="onSwiper($event)"
  (slideChange)="onSlideChange()"
  class="mySwiper"
  style="height:85%; width:100%;"
>

  <ng-template swiperSlide *ngFor="let slide of slide">
   


    <div class="slide-box">{{ slide }}</div>  <div style="width:  90%;height:0.7%; color: rgb(198, 193, 193); border: 1px solid #ccc; border-radius: 10px;background-color: rgb(198, 193, 193); margin: 0 auto;"></div>
    <div class="slide-box">{{ slide }}</div>
  </ng-template>
</swiper>


<!-- المؤشرات -->
<div
  style="text-align:center; align-items:center; justify-content:center; display:flex; flex-direction:row; width:100vw; margin-top:10px;"
>
  <div
    *ngFor="let item of list; let i = index"
    style="display:flex; flex-direction:row; width:10vw;"
  >
    <div [ngStyle]="Color(i)"></div>
  </div>
</div>
</ion-content>
