<ion-content  class="chats-content" [scrollY]="true" 
>
<div style="display: flex;flex-direction: row;margin-top: 10%;margin-inline-start: 5%;justify-content: start;">
 <ion-icon name="chevron-back" style="margin-top:0.5%;"></ion-icon>
<div style="margin-inline-start: 3%;">Chats</div>

</div><div style="display: flex; flex-direction: row; justify-content: center;margin-top: 4%;">
  
  <div class="search-box">
    <img src="assets/icon/loupe.png" class="icon" />
    <input type="text" placeholder="بحث..." class="search-input" />
  </div>

  <img
    src="assets/icon/sort.png"
    style="
      width: 6vw;height: 2vh;
      cursor: pointer;
      user-select: none;
      margin-inline-start: 3%;margin-top: 1%;
    "
  />
</div>
<div style="display: flex; flex-direction: row;justify-content: space-between;margin-left: 15%;margin-right: 15%;margin-top: 9%;">
 
  <div *ngFor="let item of list" style="margin-inline-end: 10px;">
     <div style="display: flex;flex-direction: column;justify-content: center;">
      
      <div style="text-align: center;">{{ item }}</div>
      <img
    src="assets/icon/Rectangle 173.png"
    style="
      width: 10vw;height: 1vh;
      cursor: pointer;
      user-select: none;
      margin-inline-start: 3%;
    "
  />
     </div> 
  </div>
</div>
<div style="display: flex;flex-direction: column;margin-top: 5%;">
    <div *ngFor="let item of list" style="margin-inline-end: 10px;margin-top: 7%;">
      <div style="display: flex;flex-direction: row;">
  <img
  src="assets/icon/user1.jpg" 
  class="circle-img"
/><div style="display: flex;flex-direction: column;width: 90%;"> <div style="margin-inline-start: 3vw;">John Smith</div> <div style="margin-inline-start: 3vw;font-size: 2.7vw;">How are you ?</div></div><div style="text-align: start;font-size: 2.7vw;width: 20vw;"> <p>Just Now</p></div>

      </div>
    </div>
</div>
</ion-content>
