<ion-content class="login-content">
<div style="display: flex;
            height: 7%;
            margin-top: 2%;
    
            flex-direction: row;
            width: 100vw;
            align-items: center;
            box-sizing: border-box;
           
           ">

  <!-- يسار -->
<div style="flex: 1;margin-inline-start: 0%;align-items: end;text-align: end;"><img src="assets/icon/notification.png"
         alt="Notification"
         style="width: 8vw; height: 4vh;"></div>
    
    
 
  <!-- النص في المنتصف -->
  <div style="flex:2; text-align: center; font-weight: bold;margin-inline-end: 20%;">
    notifications
  </div>

 
</div>

<div class="calendar-header">
  <ion-button fill="clear" (click)="prevMonth()">⏮</ion-button>
  <h4 (click)="nextMonth()" class="month-title">
    {{ getMonthName(currentMonth) }} {{ currentYear }}
  </h4>
  <ion-button fill="clear" (click)="nextMonth()">⏭</ion-button>
</div>

<!-- تقويم شهر واحد فقط -->
<div class="calendar-grid">
  <div class="week-days">
    <div *ngFor="let day of weekDays" class="day-header">{{ day }}</div>
  </div>

  <div class="days-grid">
    <div
      *ngFor="let day of monthDays"
      class="day-cell"
      [ngClass]="{ empty: !day }"
      (click)="onDateClick(day)"
    >
      <div *ngIf="day">
        {{ day.getDate() }}
   
      </div>
    </div>
  </div>
</div>


<p>عدد التواريخ المختارة: 📅 التاريخ المختار: {{selectedDates}}</p>


</ion-content>
