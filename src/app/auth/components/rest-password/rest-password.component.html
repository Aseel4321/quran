<ion-content class="otp-container1">  
  <div class="otp-container1">  <div style="display: flex;flex-direction: row;margin-inline-start:5%; margin-top: 10%;" (click)="goBack()"><ion-icon name="close"></ion-icon></div>
    <div style="display: flex; flex-direction: row;">
      <img src="assets/icon/reset-password.png" alt="lock image" class="imagee"/>
    </div>

    <div class="title" [ngStyle]="title()">{{ 'SECURITY_SETTINGS' | translate }}</div>

    <div
      style="margin-top: 1%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;"
    >
      <div></div>

      
      <div style="margin-top: 0%;">
        <ion-item class="input-box">
          <ion-icon name="lock-closed-outline" slot="start"  style="margin-inline-end: 1%;"
        ></ion-icon>
          <ion-input 
          (keyup)="onKeyup_password($event)"
            [(ngModel)]="password.text_password"
            [type]="password.password_type"
            [placeholder]="'OLD_PASSWORD' | translate"
          ></ion-input>
          <ion-icon 
            [name]="password.password_bool ? 'eye-off-outline' : 'eye-outline'"
             class="icon"
            (click)="eye()"
          ></ion-icon>
        </ion-item>
      </div>

   
      <div style="margin-top: 2%;">
        <ion-item class="input-box">
          <ion-icon name="lock-closed-outline" slot="start" style="margin-inline-end: 1%;"></ion-icon>
          <ion-input 
         
            [(ngModel)]="repassword.text_password"
            [type]="repassword.password_type"
            [placeholder]="'NEW_PASSWORD' | translate"
       
            (keyup)="onInputChange($event)"
          ></ion-input>
          <ion-icon 
            [name]="repassword.repassword_bool ? 'eye-off-outline' : 'eye-outline'"
           
            (click)="re_eye()"
          ></ion-icon>
        </ion-item>
      </div>
           <div
        style="margin-top: 0%; text-align: center; margin-left: 3%; margin-right: 3%; align-items: center; justify-content: center; width: 90%;margin-bottom: 0%;"
      >
      <div class="rectangle-container">
          <div
            class="rectangle"
            *ngFor="let rect of list; let i = index"
            [style.backgroundColor]="color(i)"
          ></div>
        </div>
           </div>
 <div [style.color]="password_color" style="height:3.5vw;font-size:2vw;margin-top: -2%;margin-bottom: 2%">{{Text}}</div>
   
          <ion-item class="input-box">
      <ion-icon name="lock-closed-outline" slot="start" style="margin-inline-end: 1%;"></ion-icon>
      <ion-input 
     (keyup)="onKeyup_conpassword($event)"
      
          [(ngModel)]="conpassword.text_password"
      [type]="conpassword.password_type" 
        placeholder="{{ 'PASSWORD' | translate }}"
     
      ></ion-input>
      <ion-icon  
        [name]="conpassword.password_bool ? 'eye-off-outline' : 'eye-outline'" 
        
        (click)="con_eye()">
      </ion-icon>
    </ion-item>
 <div style="height:4vw;"> <div [ngStyle]="color_password()">{{text_password}}</div></div>
  
      <button (click)="update()" [class]="validation()" type="submit" [disabled]="disabled">
        {{ 'SAVE_CHANGES' | translate }}
      </button>
           <div *ngIf="isLoading; else notLoading" style="text-align: center; margin-top: 1%;">
  <ion-spinner name="crescent" style="width: 50px; height: 50px; color:#3880ff;"></ion-spinner>
  <br/><br/>
</div>

<ng-template #notLoading>
 
  <div ></div>
</ng-template>
    </div>
  </div>
</ion-content>
